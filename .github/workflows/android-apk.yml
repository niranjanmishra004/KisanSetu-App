name: Android APK (no Studio needed)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build web + sync Capacitor
        working-directory: .
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: F-Droid compliance check (no proprietary push/GMS)
        working-directory: .
        run: |
          echo "--- must NOT contain push-notifications / gms / firebase ---"
          ! grep -ri "push-notifications" package.json || (echo "BLOCKER: FCM dep present" && exit 1)
          ! grep -ri "com.google.gms:google-services" android/build.gradle || (echo "BLOCKER: GMS classpath present" && exit 1)
          ! ls android/app/google-services.json 2>/dev/null || (echo "BLOCKER: google-services.json present" && exit 1)
          echo "FOSS check passed: local-notifications only, no Firebase."

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: kisansetu-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
