AutoName: KisanSetu
Summary: Live Indian mandi crop prices, no login
Description: |-
  KisanSetu shows live Indian mandi prices backed by Agmarknet data.

  * Live prices for 400+ crops with min/avg/max, market and arrival date
  * State filter and search in English, Hindi and Bengali
  * Price history charts and on-device price alerts (local notifications)
  * Works offline with last-known prices; no account, no tracking

