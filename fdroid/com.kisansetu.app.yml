AutoName: KisanSetu
Summary: Live Indian mandi crop prices, no login
Description: |-
  KisanSetu shows live Indian mandi prices backed by Agmarknet data.

  * Live min/avg/max prices with market, arrival date and reporting-markets count
  * State filter and search in English, Hindi and Bengali
  * On-device price alerts evaluated against live prices (no account, no tracking)
  * Works offline with last-known saved prices; location stays on your device

RepoType: git
Repo: https://github.com/niranjanmishra004/KisanSetu-App.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    # Tag the release first (e.g. `git tag v1.0 && git push origin v1.0`) —
    # F-Droid builds this tag from source.
    commit: v1.0
    gradle:
      - assembleRelease
    srclibs: []
    prebuild:
      - npm ci
      - npm run build
      - npx cap sync android
    builddir: android

AutoUpdateMode: Version v%v
